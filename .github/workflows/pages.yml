name: Validate dashboard

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Beregn historiknøgle
        id: history-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Hent valideret dashboardhistorik
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/dashboard-history.json
          key: dashboard-history-v2-${{ steps.history-key.outputs.date }}
          restore-keys: |
            dashboard-history-v2-
      - name: Hent og anonymisér aktuelle Ungapped-data
        env:
          UG_API: ${{ secrets.UG_API }}
        run: npm run sync:static
      - name: Gem valideret dashboardhistorik
        if: steps.history-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/dashboard-history.json
          key: dashboard-history-v2-${{ steps.history-key.outputs.date }}
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
