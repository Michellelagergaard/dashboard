name: Inspect Ungapped statistics routes

on:
  push:
    paths:
      - scripts/inspect-ungapped-statistics-routes.mjs
      - .github/workflows/inspect-ungapped-statistics-routes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find public statistics route candidates
        run: node scripts/inspect-ungapped-statistics-routes.mjs
