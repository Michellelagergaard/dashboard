name: Test Ungapped API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/api-smoke.yml

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Verify read-only API access
        env:
          UG_API: ${{ secrets.UG_API }}
        run: |
          node <<'NODE'
          const apiKey = process.env.UG_API;
          if (!apiKey) throw new Error("UG_API is not configured");

          const targets = [
            ["issues", "https://api.ungapped.com/Issues?$top=3"],
            ["listing", "https://api.ungapped.com/Issues/Listing"],
            ["sent", "https://api.ungapped.com/Issues/SentList?page=1&pageSize=3"],
            ["statistics", "https://api.ungapped.com/Issues/Statistics"],
          ];

          for (const [name, url] of targets) {
            const response = await fetch(url, {
              method: "GET",
              headers: { "x-api-key": apiKey, accept: "application/json" },
            });
            const body = await response.text();
            let data;
            try { data = JSON.parse(body); } catch { data = null; }
            const shape = Array.isArray(data) ? "array" : typeof data;
            const count = Array.isArray(data) ? data.length : null;
            const keys = data && !Array.isArray(data) && typeof data === "object"
              ? Object.keys(data).sort()
              : Array.isArray(data) && data[0] && typeof data[0] === "object"
                ? Object.keys(data[0]).sort()
                : [];
            console.log(JSON.stringify({ name, status: response.status, shape, count, keys }));
            if (!response.ok) process.exitCode = 1;
          }

          const latestResponse = await fetch(
            "https://api.ungapped.com/Issues/SentList?page=0&pageSize=1&sortOrder=Ended&orderByDirection=Descending",
            { headers: { "x-api-key": apiKey, accept: "application/json" } },
          );
          const [latest] = await latestResponse.json();
          const contextSchema = Object.fromEntries(["Category", "Lists", "Segments", "Journey"].map(key => {
            const value = latest[key];
            return [key, Array.isArray(value)
              ? { type: "array", itemKeys: Object.keys(value[0] ?? {}).sort() }
              : value && typeof value === "object"
                ? { type: "object", keys: Object.keys(value).sort() }
                : typeof value];
          }));
          console.log(JSON.stringify({ name: "classification-context", schema: contextSchema }));
          const overviewResponse = await fetch(
            `https://api.ungapped.com/Issues/${latest.IssueId}/Statistics/Overview`,
            { headers: { "x-api-key": apiKey, accept: "application/json" } },
          );
          const overview = await overviewResponse.json();
          const schema = Object.fromEntries(Object.entries(overview).map(([key, value]) => [
            key,
            typeof value === "number" ? "number"
              : Array.isArray(value) ? { type: "array", itemKeys: Object.keys(value[0] ?? {}).sort() }
              : value && typeof value === "object" ? { type: "object", keys: Object.keys(value).sort() }
              : typeof value,
          ]));
          console.log(JSON.stringify({ name: "latest-overview", status: overviewResponse.status, schema }));

          // This endpoint is undocumented. Inspect structure only: never log values,
          // identifiers, destinations, recipient records, or free text.
          const detailResponse = await fetch(
            `https://api.ungapped.com/Issues/Sent/${latest.IssueId}/Statistics`,
            { headers: { "x-api-key": apiKey, accept: "application/json" } },
          );
          const detail = await detailResponse.json();

          function describe(value, depth = 0) {
            if (depth >= 4) return Array.isArray(value) ? "array" : value === null ? "null" : typeof value;
            if (Array.isArray(value)) {
              return {
                type: "array",
                item: value.length > 0 ? describe(value[0], depth + 1) : "unknown",
              };
            }
            if (value && typeof value === "object") {
              return {
                type: "object",
                fields: Object.fromEntries(
                  Object.keys(value).sort().map(key => [key, describe(value[key], depth + 1)]),
                ),
              };
            }
            return value === null ? "null" : typeof value;
          }

          console.log(JSON.stringify({
            name: "sent-statistics-structure",
            status: detailResponse.status,
            schema: describe(detail),
          }));
          if (!detailResponse.ok) process.exitCode = 1;

          const issueResponse = await fetch(
            `https://api.ungapped.com/Issues/${latest.IssueId}`,
            { headers: { "x-api-key": apiKey, accept: "application/json" } },
          );
          const issue = await issueResponse.json();
          console.log(JSON.stringify({
            name: "issue-content-structure",
            status: issueResponse.status,
            schema: describe(issue),
          }));
          if (!issueResponse.ok) process.exitCode = 1;
          NODE
